<html>
<head>
    <title>Block Layout</title>

    <style>
        .container {
            border: 1px solid red;
            display: grid;
            grid-template-rows: 20vh 30vh 30vh 20vh;
            grid-template-columns: 25% 25% 25% 25%;
        }

        .sec1 {
            background-color: red;
            grid-row: 1 / 2;
            grid-column: 1 / 5;
        }

        .sec2 {
            background-color: yellow;
            grid-row: 2 / 3;
            grid-column: 1 / 2;
        }

        .sec3 {
            background-color: lightblue;
            grid-row: 2 / 3;
            grid-column: 2 / 3;
        }

        .sec4 {
            background-color: orange;
            grid-row: 2 / 3;
            grid-column: 3 / 4;
        }

        .sec5 {
            background-color: magenta;
            grid-row: 2 / 4;
            grid-column: 4 / 5;
        }

        .sec6 {
            background-color: blue;
            grid-row: 3 / 4;
            grid-column: 1 / 4;
        }

        .sec7 {
            background-color: green;
            grid-row: 4 / 5;
            grid-column: 1 / 5;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="sec1">Section 1</div>

        <div class="sec2">Section 2</div>

        <div class="sec3">Section 3</div>

        <div class="sec4">Section 4</div>

        <div class="sec5">Section 5</div>

        <div class="sec6">Section 6</div>

        <div class="sec7">Section 7</div>

    </div>

</body>
</html>
